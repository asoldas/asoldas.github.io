<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>As Old As</title>
<meta name="description" content="As Old As introduces you to notable people from history on the day you reach the age they died.">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{--bg:#F3EBDD;--ink:#1B2A22;--accent:#1F4B3A;--muted:#4B5A50}
@media (prefers-color-scheme:dark){:root{--bg:#14181A;--ink:#F3EBDD;--accent:#8FB5A0;--muted:#B7B09F}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:48px 24px 64px}
h1{font:700 40px/1.2 "New York",Georgia,"Times New Roman",serif;margin:16px 0 8px}
p{margin:0 0 16px}
a{color:var(--accent)}
img{width:96px;height:96px;border-radius:22px;display:block}
.muted{color:var(--muted)}
nav a{margin-right:20px}
</style>
</head>
<body>
<main>
<img src="icon.png" alt="As Old As app icon">
<h1>As Old As</h1>
<p>Some days, you reach the exact age at which a notable person from history died. On those days, As Old As sends one quiet notification with their name. Tap it to learn who they were.</p>
<p class="muted">We do not collect any personal data.</p>
<nav>
<a href="support.html">Support</a>
<a href="privacy.html">Privacy Policy</a>
</nav>
</main>
</body>
</html>
